title: All libraries
description: ABAP libraries from Birzhan Moldabayev
url: "https://bizhuka.github.io"
baseurl: ""
repository: bizhuka/bizhuka.github.io

theme: just-the-docs
permalink: pretty
lang: en-US

exclude:
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: "k"

enable_copy_code_button: true
heading_anchors: true

aux_links:
  "on GitHub":
    - "https://github.com/bizhuka/"
aux_links_new_tab: false

nav_enabled: true
nav_sort: case_sensitive

back_to_top: true
back_to_top_text: "Back to top"

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: true
gh_edit_link_text: "Page on GitHub"
gh_edit_repository: "https://github.com/bizhuka/bizhuka.github.io"
gh_edit_branch: "master"
gh_edit_view_mode: "tree"

color_scheme: light
favicon_ico: "/favicon.ico"

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

kramdown:
  parse_block_html: true
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  quiet_deps: true
  silence_deprecations:
    - import

defaults:
  - scope:
      path: "docs"
      type: pages
    values:
      layout: post
      lang: en-US
      _locale: en
  - scope:
      path: "docs_ru"
      type: pages
    values:
      layout: post
      lang: ru
      _locale: ru

disqus_shortname: github-io-17
